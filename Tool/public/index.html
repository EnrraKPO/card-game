<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardGame Authoring Tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E⚒%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">⚒ CardGame Authoring</div>
    <div id="type-tabs"></div>
    <div id="comfy-badge" class="badge" title="ComfyUI connection">ComfyUI: …</div>
    <button id="chat-btn" class="ghost" title="Chat with an AI to make blanket content edits">💬 AI edit</button>
    <button id="settings-btn" class="ghost">Settings</button>
  </header>
  <div id="main">
    <nav id="sidebar">
      <div id="item-list-wrap">
        <div id="item-list-head">
          <span id="item-list-title"></span>
          <button id="gen-set-btn" class="ghost" hidden title="Generate a whole composition family as individual cards">⚙ Set…</button>
          <button id="bulk-edit-btn" class="ghost" hidden title="Set / pump a stat, or grant an ability or effect to EVERY card currently matching the filter">≡ Bulk…</button>
          <button id="new-item-btn">+ New</button>
        </div>
        <div id="item-list"></div>
      </div>
    </nav>
    <section id="editor">
      <div id="editor-empty" class="empty-hint">
        <h2>Pick a content type, then an item — or create a new one.</h2>
        <p>Everything you author lives in the Tool's own workspace. Nothing touches the
        game until you press <b>Install</b>, and <b>Uninstall</b> removes exactly what
        was installed.</p>
        <div class="panel" id="empty-kin-panel" hidden></div>
      </div>
      <div id="editor-body" hidden>
        <div id="editor-toolbar">
          <div id="item-title"></div>
          <div class="spacer"></div>
          <span id="dirty-flag" hidden>unsaved changes</span>
          <label class="check" id="enabled-wrap" title="Disabled entries stay in the file but the game skips them">
            <input type="checkbox" id="enabled-check" checked> Enabled
          </label>
          <button id="save-btn" class="primary">Save to game</button>
          <button id="revert-btn" class="ghost" hidden>Revert</button>
          <button id="delete-btn" class="danger">Delete</button>
        </div>
        <div id="install-info" class="install-info"></div>
        <div id="validation-msg" hidden></div>
        <div id="editor-columns">
          <div id="form-col"></div>
          <div id="side-col">
            <div class="panel" id="summary-panel">
              <h3>In plain words</h3>
              <div id="summary-body"></div>
            </div>
            <div class="panel" id="art-panel"></div>
            <div class="panel" id="json-panel">
              <h3>Deployed JSON <button id="copy-json" class="ghost tiny">copy</button></h3>
              <pre id="json-preview"></pre>
            </div>
          </div>
        </div>
      </div>
      <div id="tuning-body" hidden></div>
      <div id="localization-body" hidden></div>
    </section>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="/helpers.js"></script>
<script src="/effects.js"></script>
<script src="/editors.js"></script>
<script src="/app.js"></script>
</body>
</html>
