<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Chunky golden "!" attention badge. Placeholder art: drop an alert_bang.png next to this
       file and the game picks it up instead (see map.gd _bang_texture). -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffef9f"/>
      <stop offset="38%"  stop-color="#ffd23f"/>
      <stop offset="72%"  stop-color="#f0a71c"/>
      <stop offset="100%" stop-color="#c9760a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <!-- The bar and the dot, declared once and reused for the outline pass + the fill pass. -->
    <g id="bang">
      <path d="M100 34 h56 a12 12 0 0 1 12 13 l-14 116 a12 12 0 0 1 -12 11 h-28 a12 12 0 0 1 -12 -11 l-14 -116 a12 12 0 0 1 12 -13 z"/>
      <circle cx="128" cy="209" r="29"/>
    </g>
  </defs>

  <!-- Soft dark halo so the badge stays readable over bright button art. -->
  <use href="#bang" fill="#2a1704" opacity="0.35" transform="translate(0,7)"/>
  <!-- Outline pass. -->
  <use href="#bang" fill="#3d2206" stroke="#3d2206" stroke-width="20" stroke-linejoin="round"/>
  <!-- Gold face. -->
  <use href="#bang" fill="url(#gold)"/>
  <!-- Left-edge sheen on the bar only. -->
  <path d="M104 50 h20 l-5 108 h-9 z" fill="url(#sheen)"/>
</svg>
